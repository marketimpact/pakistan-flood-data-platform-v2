repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3.11
        args: ['--line-length=100']

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ['--profile', 'black', '--line-length=100']

  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--extend-ignore=E203,W503']
        additional_dependencies: [flake8-docstrings]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.3.0
    hooks:
      - id: mypy
        additional_dependencies: [django-stubs, djangorestframework-stubs]
        args: ['--ignore-missing-imports']

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ['-r', 'src/', '-ll']
        exclude: 'tests/'

  - repo: local
    hooks:
      - id: django-check
        name: Django Check
        entry: python src/manage.py check
        language: system
        pass_filenames: false
        always_run: true

      - id: django-migrations
        name: Check Django Migrations
        entry: python src/manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-check
        name: Run Tests
        entry: bash -c 'cd src && pytest core/tests/test_models_comprehensive.py::TestGaugeModel::test_gauge_creation -xvs'
        language: system
        pass_filenames: false
        always_run: true